        const FluidBackground = () => {
            const canvasRef = useRef(null);
            const mouseRef = useRef({ x: 0, y: 0 });
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];
                let hueCycle = 0;
                const resizeCanvas = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                class Particle {
                    constructor() { this.reset(); this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; }
                    reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2 + 1; this.life = Math.random() * 100 + 50; this.opacity = 0; this.maxOpacity = Math.random() * 0.6 + 0.3; this.vx = 0; this.vy = 0; }
                    update(mouseX, mouseY, time) {
                        const angle = (Math.cos(this.x * 0.003) + Math.sin(this.y * 0.003) + Math.sin(time * 0.001)) * Math.PI * 2;
                        this.vx = Math.cos(angle) * 1.2; this.vy = Math.sin(angle) * 1.2;
                        const dx = this.x - mouseX; const dy = this.y - mouseY; const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 200) { const force = (200 - distance) / 200; this.vx += (dx / distance) * force * 5; this.vy += (dy / distance) * force * 5; }
                        this.x += this.vx; this.y += this.vy; this.life--;
                        if (this.life < 20) this.opacity -= 0.03; else if (this.opacity < this.maxOpacity) this.opacity += 0.03;
                        if (this.life <= 0 || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) { this.reset(); }
                    }
                    draw() {
                        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy); const finalHue = ((this.x / canvas.width) * 60 + (this.y / canvas.height) * 60 + (240 - speed * 40) + hueCycle) % 360;
                        ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = `hsla(${finalHue}, 70%, 55%, ${this.opacity})`; ctx.fill();
                    }
                }
                const init = () => { resizeCanvas(); particles = []; const count = Math.min((canvas.width * canvas.height) / 4000, 300); for (let i = 0; i < count; i++) particles.push(new Particle()); };
                let time = 0;
                const animate = () => { ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height); time++; hueCycle += 0.1; particles.forEach(p => { p.update(mouseRef.current.x, mouseRef.current.y, time); p.draw(); }); animationFrameId = requestAnimationFrame(animate); };
                const handleMouseMove = (e) => mouseRef.current = { x: e.clientX, y: e.clientY };
                window.addEventListener('resize', () => { resizeCanvas(); init(); }); window.addEventListener('mousemove', handleMouseMove); init(); animate();
                return () => { window.removeEventListener('resize', resizeCanvas); window.removeEventListener('mousemove', handleMouseMove); cancelAnimationFrame(animationFrameId); };
            }, []);
            return <canvas ref={canvasRef} id="bg-canvas" />;
        };

                        <div className="absolute top-0 right-0 w-96 h-96 bg-purple-600/20 rounded-full mix-blend-screen blur-[100px] -mr-20 -mt-20 pointer-events-none"></div> <div className="absolute bottom-0 left-0 w-96 h-96 bg-indigo-500/20 rounded-full mix-blend-screen blur-[100px] -ml-20 -mb-20 pointer-events-none"></div>
                        <div className="relative z-10 p-8 md:p-16 text-center">
                            <h2 className="text-3xl md:text-5xl font-bold text-white mb-6">Let's Connect</h2> <p className="text-slate-400 mb-12 text-lg max-w-2xl mx-auto leading-relaxed"> Open to collaborations on stability analysis, CFD projects, and academic discussions. Feel free to reach out via email. </p>
                            <div className="grid md:grid-cols-3 gap-6 mb-12">
                                <div className="bg-slate-900/50 border border-slate-800 p-8 rounded-2xl flex flex-col items-center hover:bg-slate-800/50 transition-colors group"> <div className="w-12 h-12 rounded-full bg-indigo-900/30 flex items-center justify-center text-indigo-400 mb-4 border border-indigo-500/20 group-hover:scale-110 transition-transform"> <Home size={20} /> </div> <h3 className="text-white font-bold text-lg mb-1">Permanent</h3> <div className="text-slate-400 text-sm"> <EditableField isEditing={isEditing} value={data.contact.permanent} onChange={(v) => updateContact('permanent', v)} className={isEditing ? "bg-white/10 text-white" : ""} /> </div> </div>
                                <div className="bg-slate-900/50 border border-slate-800 p-8 rounded-2xl flex flex-col items-center hover:bg-slate-800/50 transition-colors group"> <div className="w-12 h-12 rounded-full bg-purple-900/30 flex items-center justify-center text-purple-400 mb-4 border border-purple-500/20 group-hover:scale-110 transition-transform"> <Wind size={20} /> </div> <h3 className="text-white font-bold text-lg mb-1">Current</h3> <div className="text-slate-400 text-sm"> <EditableField isEditing={isEditing} value={data.contact.location} onChange={(v) => updateContact('location', v)} className={isEditing ? "bg-white/10 text-white" : ""} /> </div> </div>
                                <div className="bg-slate-900/50 border border-slate-800 p-8 rounded-2xl flex flex-col items-center hover:bg-slate-800/50 transition-colors group"> <div className="w-12 h-12 rounded-full bg-teal-900/30 flex items-center justify-center text-teal-400 mb-4 border border-teal-500/20 group-hover:scale-110 transition-transform"> <Activity size={20} /> </div> <h3 className="text-white font-bold text-lg mb-1">Phone</h3> <div className="text-slate-400 text-sm"> <EditableField isEditing={isEditing} value={data.contact.phone} onChange={(v) => updateContact('phone', v)} className={isEditing ? "bg-white/10 text-white" : ""} /> </div> </div>
                            </div>
                            <div className="flex flex-col md:flex-row justify-center items-center gap-4"> <div className="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-xl flex items-center justify-center gap-3 w-full md:w-auto transition-all shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/40 min-w-[300px] cursor-pointer"> <Mail size={20} /> <EditableField isEditing={isEditing} value={data.contact.email} onChange={(v) => updateContact('email', v)} className="bg-transparent font-bold outline-none text-white text-lg cursor-pointer" /> </div> <div className="flex gap-4"> <button className="w-14 h-14 bg-slate-800 rounded-xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 transition-colors border border-slate-700 shadow-lg"> <Linkedin size={24} /> </button> <button className="w-14 h-14 bg-slate-800 rounded-xl flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-700 transition-colors border border-slate-700 shadow-lg"> <ExternalLink size={24} /> </button> </div> </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [data, setData] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [loginPass, setLoginPass] = useState('');
            const [loginEmail, setLoginEmail] = useState(''); // New State for Email
            const [loading, setLoading] = useState(true);
            const [user, setUser] = useState(null);
            const [error, setError] = useState(null);
            const [saveStatus, setSaveStatus] = useState(null);
            const [isSaving, setIsSaving] = useState(false);

            useEffect(() => {
                let isDataLoaded = false;
                let unsubscribeSnapshot = () => {};
                let unsubscribeAuth = () => {};

                const fetchData = async () => {
                    logToConsole("Starting Data Fetch...");
                    if (!isFirebaseAvailable) {
                        logToConsole("Firebase Not Available - Using Default Data");
                        setData(DEFAULT_DATA);
                        setLoading(false);
                        return;
                    }
                    try {
                        logToConsole("Setting up Firestore Listener...");
                        const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('site_content').doc('main');
                        unsubscribeSnapshot = docRef.onSnapshot((doc) => {
                            isDataLoaded = true;
                            if (doc.exists) {
                                logToConsole("Data received from Firestore!");
                                setData(doc.data());
                            } else {
                                logToConsole("Doc doesn't exist. Creating default...");
                                docRef.set(DEFAULT_DATA).then(() => logToConsole("Default data created.")).catch(e => logToConsole("Initial write failed: " + e.message));
                                setData(DEFAULT_DATA);
                            }
                            setLoading(false);
                        }, (err) => {
                            logToConsole("Firestore Read Error: " + err.code);
                            if (!isDataLoaded) { setData(DEFAULT_DATA); setLoading(false); isDataLoaded = true; }
                        });
                    } catch (e) {
                        console.error("Setup Error:", e);
                        if (!isDataLoaded) { setData(DEFAULT_DATA); setLoading(false); }
                    }
                    unsubscribeAuth = auth.onAuthStateChanged((u) => { 
                        setUser(u); 
                        if(u) {
                            setIsAdmin(true);
                            logToConsole("Admin Logged In: " + u.email);
                        } else {
                            setIsAdmin(false);
                        }
                    });
                };
                fetchData();
                const timer = setTimeout(() => { if (!isDataLoaded) { setData(DEFAULT_DATA); setLoading(false); isDataLoaded = true; } }, 3000); 
                return () => { clearTimeout(timer); unsubscribeSnapshot(); unsubscribeAuth(); };
            }, []);

            const handleSave = async () => {
                if (!isFirebaseAvailable) { alert("Offline Mode: Cannot save."); return; }
                setIsSaving(true); 
                try {
                    const cleanData = JSON.parse(JSON.stringify(data)); 
                    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 15000));
                    await Promise.race([ db.collection('artifacts').doc(appId).collection('public').doc('data').collection('site_content').doc('main').set(cleanData), timeout ]);
                    setIsEditing(false);
                    setSaveStatus('success');
                    setTimeout(() => setSaveStatus(null), 3000);
                } catch (e) {
                    alert("Error saving data: " + e.message);
                } finally { setIsSaving(false); }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    await auth.signInWithEmailAndPassword(loginEmail, loginPass);
                    setShowLogin(false);
                    setLoginPass('');
                    setLoginEmail('');
                } catch (error) {
                    alert("Login Failed: " + error.message);
                }
            };

            const handleLogout = () => {
                auth.signOut();
                setIsEditing(false);
            };

            // Helpers
            const updateHome = (field, val) => setData(prev => ({...prev, home: {...prev.home, [field]: val}}));
            const updateStats = (idx, field, val) => { const newStats = [...data.home.stats]; newStats[idx][field] = val; setData(prev => ({...prev, home: {...prev.home, stats: newStats}})); };
            const updateArrayItem = (category, index, field, val) => {
                setData(prev => {
                    const newArr = [...prev[category]];
                    newArr[index] = { ...newArr[index], [field]: val };
                    return { ...prev, [category]: newArr };
                });
            };
            const addArrayItem = (category, template) => { setData(prev => ({ ...prev, [category]: [...prev[category], template] })); };
            const deleteArrayItem = (category, index) => { const newArr = data[category].filter((_, i) => i !== index); setData(prev => ({ ...prev, [category]: newArr })); };

            if (loading || !data) return <div className="h-screen flex items-center justify-center text-indigo-600 animate-pulse flex-col gap-4"><Loader2 size={32} className="animate-spin" /><span>Loading Content...</span></div>;
            if (error) return <div className="h-screen flex items-center justify-center text-red-600">Error: {error}</div>;

            return (
                <div className="font-sans text-slate-700 min-h-screen relative overflow-hidden selection:bg-indigo-200 selection:text-indigo-900">
                    <FluidBackground />
                    <Navbar activeTab={activeTab} setActiveTab={setActiveTab} isAdmin={isAdmin} isEditing={isEditing} setIsEditing={setIsEditing} handleSave={handleSave} isSaving={isSaving} />
                    <main className="pt-24 pb-12 transition-opacity duration-300 ease-in-out">
                        {activeTab === 'home' && <HomePage data={data} isEditing={isEditing} updateHome={updateHome} updateStats={updateStats} setActiveTab={setActiveTab} />}
                        {activeTab === 'research' && <ResearchPage data={data} isEditing={isEditing} updateArrayItem={updateArrayItem} addArrayItem={addArrayItem} deleteArrayItem={deleteArrayItem} />}
                        {activeTab === 'publications' && <PublicationsPage data={data} isEditing={isEditing} updateArrayItem={updateArrayItem} addArrayItem={addArrayItem} deleteArrayItem={deleteArrayItem} setData={setData} />}
                        {activeTab === 'cv' && <CVPage data={data} isEditing={isEditing} setData={setData} />}
                        {activeTab === 'contact' && <ContactPage data={data} isEditing={isEditing} setData={setData} />}
                    </main>
                    <footer className="w-full text-center py-6 text-slate-700 text-xs font-medium tracking-wide bg-white/40 backdrop-blur-sm flex justify-center items-center gap-4">
                        <span>&copy; {new Date().getFullYear()} Dr. Hossain. Fluid Dynamics Research Group.</span>
                        {isAdmin ? (
                            <button onClick={handleLogout} className="text-slate-400 hover:text-red-600 transition-colors" title="Logout"> <Unlock size={14} /> </button>
                        ) : (
                            <button onClick={() => setShowLogin(true)} className="text-slate-400 hover:text-indigo-600 transition-colors" title="Admin Login"> <Lock size={14} /> </button>
                        )}
                    </footer>
                    {!isFirebaseAvailable && isAdmin && ( <div className="fixed bottom-4 right-4 bg-amber-100 text-amber-800 px-4 py-2 rounded-lg shadow-lg text-xs font-bold flex items-center z-50 animate-bounce"> <AlertCircle size={16} className="mr-2"/> Offline Mode (See Code to Fix) </div> )}
                    {saveStatus === 'success' && ( <div className="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-6 py-3 rounded-full shadow-2xl flex items-center z-[70] animate-slide-up"> <Check size={20} className="mr-2" /> <span className="font-bold">Saved Successfully!</span> </div> )}
                    
                    {/* Updated Login Modal with Firebase Auth */}
                    {showLogin && ( 
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm animate-fade-in"> 
                            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full"> 
                                <h3 className="text-xl font-bold mb-4 text-slate-900">Admin Login</h3> 
                                <form onSubmit={handleLogin} className="space-y-4"> 
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase">Email</label>
                                        <input type="email" value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} placeholder="admin@example.com" className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" autoFocus required /> 
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 uppercase">Password</label>
                                        <input type="password" value={loginPass} onChange={(e) => setLoginPass(e.target.value)} placeholder="••••••••" className="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" required /> 
                                    </div>
                                    <div className="flex gap-2 pt-2"> 
                                        <button type="submit" className="flex-1 bg-indigo-600 text-white py-2 rounded-xl font-bold hover:bg-indigo-700 transition-colors">Sign In</button> 
                                        <button type="button" onClick={() => setShowLogin(false)} className="flex-1 bg-slate-100 text-slate-600 py-2 rounded-xl font-bold hover:bg-slate-200 transition-colors">Cancel</button> 
                                    </div> 
                                </form> 
                            </div> 
                        </div> 
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
