        // --- 1. Background Components (Unchanged) ---

        const FluidBackground = () => {
          const canvasRef = useRef(null);
          const mouseRef = useRef({ x: 0, y: 0 });

          useEffect(() => {
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            let animationFrameId;
            let particles = [];
            let hueCycle = 0;
            
            const resizeCanvas = () => {
              canvas.width = window.innerWidth;
              canvas.height = window.innerHeight;
            };

            const flowScale = 0.003; 
            const speedBase = 1.2;
            
            class Particle {
              constructor() {
                this.reset();
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
              }

              reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.life = Math.random() * 100 + 50;
                this.opacity = 0;
                this.maxOpacity = Math.random() * 0.6 + 0.3;
                this.vx = 0;
                this.vy = 0;
              }

              update(mouseX, mouseY, time) {
                const angle = (Math.cos(this.x * flowScale) + Math.sin(this.y * flowScale) + Math.sin(time * 0.001)) * Math.PI * 2;
                this.vx = Math.cos(angle) * speedBase;
                this.vy = Math.sin(angle) * speedBase;

                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const interactionRadius = 200;

                if (distance < interactionRadius) {
                  const force = (interactionRadius - distance) / interactionRadius;
                  this.vx += (dx / distance) * force * 5;
                  this.vy += (dy / distance) * force * 5;
                }

                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                if (this.life < 20) this.opacity -= 0.03;
                else if (this.opacity < this.maxOpacity) this.opacity += 0.03;

                if (this.life <= 0 || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                  this.reset();
                }
              }

              draw() {
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const positionalHue = (this.x / canvas.width) * 60 + (this.y / canvas.height) * 60; 
                const dynamicHue = 240 - (speed * 40); 
                const finalHue = (positionalHue + dynamicHue + hueCycle) % 360;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${finalHue}, 70%, 55%, ${this.opacity})`;
                ctx.fill();
              }
            }

            const init = () => {
              resizeCanvas();
              particles = [];
              const count = Math.min((canvas.width * canvas.height) / 4000, 400); 
              for (let i = 0; i < count; i++) {
                particles.push(new Particle());
              }
            };

            let time = 0;
            const animate = () => {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; 
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              time++;
              hueCycle += 0.1; 

              particles.forEach(particle => {
                particle.update(mouseRef.current.x, mouseRef.current.y, time);
                particle.draw();
              });
              animationFrameId = requestAnimationFrame(animate);
            };

            const handleMouseMove = (e) => {
              mouseRef.current = { x: e.clientX, y: e.clientY };
            };

            window.addEventListener('resize', () => { resizeCanvas(); init(); });
            window.addEventListener('mousemove', handleMouseMove);

            init();
            animate();

            return () => {
              window.removeEventListener('resize', resizeCanvas);
              window.removeEventListener('mousemove', handleMouseMove);
              cancelAnimationFrame(animationFrameId);
            };
          }, []);

          return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full -z-10 bg-white" />;
        };
